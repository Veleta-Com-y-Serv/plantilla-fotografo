      - { titulo: Reservamos, texto: "Fijamos fecha con una pequeña señal y te mando una guía para preparar la sesión.", icono: calendario }
      - { titulo: Disparamos, texto: "Una sesión sin prisas. Tú solo tienes que estar; de la luz me encargo yo.", icono: camara }
      - { titulo: Te lo entrego, texto: "En dos o tres semanas tienes la galería privada lista para descargar y compartir.", icono: descarga }


  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de reservar
    preguntas:
      - { pregunta: "¿Cuánto tardo en recibir las fotos?", respuesta: "Entre dos y tres semanas para las sesiones y unas seis semanas para las bodas. Te aviso en cuanto la galería está lista." }
      - { pregunta: "¿Cómo se reserva una fecha?", respuesta: "Con una señal del 30 %, que se descuenta del total. El resto se paga el día de la sesión o, en bodas, la semana anterior." }
      - { pregunta: "¿Qué pasa si llueve el día de la sesión?", respuesta: "En Gijón pasa. Si la sesión es en exteriores, la movemos sin coste a otro día o la hacemos en el estudio." }
      - { pregunta: "¿Trabajáis fuera de Gijón?", respuesta: "Sí, en toda Asturias. Fuera de Gijón se suma el desplazamiento, que te indicamos en el presupuesto." }
      - { pregunta: "¿Puedo pedir las fotos sin editar?", respuesta: "Entrego solo las fotos editadas, porque la edición es parte del trabajo. Si quieres más fotos de las incluidas, se pueden añadir." }

